<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>typoscope</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="controls">
    <input type="file" id="fileInput" accept="application/pdf">
    <label>
      Zoom
      <input type="number" id="zoomInput" min="0.5" max="4" step="0.25" value="1.5">
    </label>
  </header>

  <div id="viewer"></div>

  <div id="focusOverlay"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
